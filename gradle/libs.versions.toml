[versions]
agp = "8.13.2"
kotlin = "2.3.21"
ksp = "2.3.14"
hilt = "2.58"
hiltNavCompose = "1.2.0"
room = "2.8.5"
ktor = "3.1.2"
serialization = "1.8.1"
coroutines = "1.11.0"
